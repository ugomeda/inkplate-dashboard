[cache]
path = ".cache"

[display]
location = [40.75, -73.99]
timezone = "America/New_York"
locale = "en_US"
units = "imperial"
refresh_interval_sec = 1800  # refresh every 30 minutes
weather_hours_interval = 4

[[display.feeds]]
