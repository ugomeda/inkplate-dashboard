<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Inkplate 10 display</title>
    <link rel="stylesheet" type="text/css" href="/static/fonts.css">
    <link rel="stylesheet" type="text/css" href="/static/inkplate10.css">
    <script src="/static/scripts.js"></script> 
  </head>
  <body>
    <div id="display">
      <div class="widget-header">
        <div>{{ filters.format_day(data.now, "full") }}</div>
        {% include "lucide-icons/" ~ data.battery_icon ~ ".svg" %}
      </div>
      {% include "inkplate10/weather.html" %}
      {% include "inkplate10/news.html" %}
    </div>
    <script>
      window.addEventListener("load", function(){
        fitNewsColumn(".widget-headlines");
      });
    </script>
  </body>
</html>
