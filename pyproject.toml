[project]
name = "epaper-dashboard"
version = "0.1.0"
description = "RSS and weather dashboard for Inkplate 6 and Spectra 6 displays"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "babel>=2.18.0",
    "defusedxml>=0.7.1",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "pydantic>=2.14.3",
    "requests>=2.34.2",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.4",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",
    "E", "W",
    "YTT",
    "B",
    "Q",
    "G",
    "C4",
    "PLE", "PLW",
    "PIE",
    "TID",
    "ISC",
    "TCH",
    "I",
    "UP",
]
ignore = ["ISC001"]

[tool.mypy]
python_version = "3.11"
strict = true
